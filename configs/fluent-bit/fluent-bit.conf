[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf
    Storage.path  /fluentbit-buffer/buffer
    Storage.sync  normal
    Storage.checksum off
    Storage.backlog.mem_limit 15M

# 1. Ingest /var/log/secure
[INPUT]
    Name              tail
    Tag               host.auth
    Path              /var/log/secure
    DB                /fluentbit-buffer/auth_tail.db
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    Refresh_Interval  1

# 2. Ingest /var/log/audit/audit.log
[INPUT]
    Name              tail
    Tag               host.audit
    Path              /var/log/audit/audit.log
    DB                /fluentbit-buffer/audit_tail.db
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    Refresh_Interval  1

# 3. Ingest systemd-journald
[INPUT]
    Name              systemd
    Tag               host.journal
    Path              /run/log/journal
    Read_From_Tail    On

# 4. Ingest Remote Syslog (TCP & UDP on Port 5140)
[INPUT]
    Name              syslog
    Tag               remote.syslog
    Mode              tcp
    Port              5140
    Parser            syslog_rfc5424

[INPUT]
    Name              syslog
    Tag               remote.syslog
    Mode              udp
    Port              5140
    Parser            syslog_rfc5424

# --- NORMALIZATION FILTERS ---
[FILTER]
    Name              modify
    Match             host.auth
    Rename            log message

[FILTER]
    Name              modify
    Match             host.audit
    Rename            log message

[FILTER]
    Name              modify
    Match             host.journal
    Rename            MESSAGE message

# --- PARSING FILTERS ---
[FILTER]
    Name              parser
    Match             *
    Key_Name          message
    Parser            sshd_failed_login
    Reserve_Data      On
    Preserve_Key      On

[FILTER]
    Name              parser
    Match             *
    Key_Name          message
    Parser            sshd_invalid_user
    Reserve_Data      On
    Preserve_Key      On

[FILTER]
    Name              parser
    Match             *
    Key_Name          message
    Parser            sudo_violation
    Reserve_Data      On
    Preserve_Key      On

[FILTER]
    Name              parser
    Match             host.audit
    Key_Name          message
    Parser            auditd_syscall
    Reserve_Data      On
    Preserve_Key      On

[FILTER]
    Name              parser
    Match             host.audit
    Key_Name          message
    Parser            auditd_header
    Reserve_Data      On
    Preserve_Key      On

# Metadata
[FILTER]
    Name              record_modifier
    Match             *
    Record            lab_node rhel-9.6-siem
    Record            pipeline fluent-bit-c-engine

# Output: Route into OpenSearch 2.18
[OUTPUT]
    Name                opensearch
    Match               *
    Host                172.28.0.20
    Port                9200
    Suppress_Type_Name  On
    Generate_ID         On
    Logstash_Format     On
    Logstash_Prefix     logs-security
    Logstash_DateFormat %Y.%m.%d
    Time_Key            @timestamp
    Include_Tag_Key     On
    Tag_Key             routing_tag
    Workers             2
    Trace_Error         On
